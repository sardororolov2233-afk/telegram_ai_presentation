# Run from the repository root: docker compose up --build -d
services:
  app:
    build: ..
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      JOB_STORAGE_DIR: /data/orzu-jobs
    volumes:
      - generation_data:/data/orzu-jobs
    restart: unless-stopped
volumes:
  generation_data:
